<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Enhance AI</title>

    <link rel="stylesheet" href="enhance.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>✨ Photo <span>Enhance AI</span></h1>
        <p>Make your photos sharper, clearer and better.</p>
    </div>

    <div class="upload-box" id="uploadBox">

        <div class="upload-icon">📸</div>

        <h2>Upload Your Photo</h2>

        <p>Drag & drop your image here</p>

        <label for="fileInput" class="upload-btn">
            Choose Photo
        </label>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
        >

    </div>


    <div class="preview-section" id="previewSection">

        <h2>Photo Preview</h2>

        <img
            id="previewImage"
            class="preview"
            alt="Photo Preview"
        >

        <div class="file-name" id="fileName"></div>

        <div class="actions">

            <button
                id="enhanceBtn"
                class="enhance-btn">
                ✨ Enhance Photo
            </button>

            <button
                id="resetBtn"
                class="reset-btn">
                🔄 Choose Another
            </button>

            <button
                id="downloadBtn"
                class="download-btn">
                ⬇ Download
            </button>

        </div>


        <div class="loading" id="loading">

            <div class="spinner"></div>

            <p>Enhancing your photo...</p>

        </div>

    </div>


    <div class="features">

        <div class="feature">
            <div class="feature-icon">✨</div>
            <h3>AI Enhancement</h3>
            <p>Improve image quality</p>
        </div>

        <div class="feature">
            <div class="feature-icon">🔍</div>
            <h3>HD Upscale</h3>
            <p>Increase resolution</p>
        </div>

        <div class="feature">
            <div class="feature-icon">⚡</div>
            <h3>Fast Processing</h3>
            <p>Quick enhancement</p>
        </div>

    </div>

</div>


<script src="enhance.js"></script>

</body>
</html>
