<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email Verified — SM Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .card {
      width: 100%;
      max-width: 450px;
      padding: 40px 30px;
      background: #fff;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 22px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 14px;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .button:hover {
      opacity: 0.85;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111;
        color: #fff;
      }

      .card {
        background: #1d1d1d;
      }

      h1 {
        color: #fff;
      }

      p {
        color: #bbb;
      }

      .status {
        color: #999;
      }

      .logo,
      .button {
        background: #fff;
        color: #111;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      SM
    </div>

    <h1>Email Verified!</h1>

    <p>
      Your email address has been successfully verified.
      Welcome to <strong>SM Studio</strong>.
    </p>

    <a href="index.html" class="button">
      Continue to SM Studio
    </a>

    <div class="status" id="status">
      Verification successful.
    </div>

  </div>

  <script>
    // Page loaded successfully
    console.log("SM Studio email verification page loaded.");

    const status = document.getElementById("status");

    status.textContent = "Your account is now verified.";
  </script>

</body>
</html>
